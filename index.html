<!DOCTYPE html><html lang="en"><head><title>Language Translation Tool</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f5f6fa;color:#222}h1{font-size:1.4rem}select,textarea,button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin:6px 0}button{background:#4f46e5;color:#fff;border:0;cursor:pointer}button.alt{background:#fff;color:#222;border:1px solid #bbb}.row{display:flex;gap:8px}.card{background:#fff;padding:12px;border-radius:10px;margin-top:10px;min-height:20px;white-space:pre-wrap}</style></head><body>
<h1>🌐 Language Translation Tool</h1>
<div class="row"><select id="src"></select><select id="tgt"></select></div>
<textarea id="text" rows="5" maxlength="500" placeholder="Enter text (max 500 characters)"></textarea>
<button onclick="tr()">Translate</button>
<div class="card" id="out">Translation will appear here</div>
<div class="row"><button class="alt" onclick="navigator.clipboard.writeText(out.innerText);this.innerText='Copied ✓'">📋 Copy</button><button class="alt" onclick="speak()">🔊 Speak</button></div>
<script>
const L={"Auto Detect":"autodetect",English:"en",Hindi:"hi",Marathi:"mr",Gujarati:"gu",Tamil:"ta",Telugu:"te",Bengali:"bn",Urdu:"ur",Spanish:"es",French:"fr",German:"de",Italian:"it",Portuguese:"pt",Russian:"ru",Japanese:"ja",Korean:"ko","Chinese (Simplified)":"zh-CN",Arabic:"ar"};
for(const[n,c]of Object.entries(L)){src.add(new Option(n,c));if(c!="autodetect")tgt.add(new Option(n,c))}
src.value="en";tgt.value="hi";
async function tr(){const t=text.value.trim();if(!t)return alert("Please enter some text");out.innerText="Translating...";
 try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+src.value+"|"+tgt.value);
 const j=await r.json();out.innerText=j.responseData.translatedText}catch(e){out.innerText="Error: "+e.message}}
function speak(){const u=new SpeechSynthesisUtterance(out.innerText);u.lang=tgt.value;speechSynthesis.speak(u)}
</script></body></html>
